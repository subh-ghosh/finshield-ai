version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: finshield-backend
    ports:
      - "8000:8000"
    environment:
      # Pass API Key for Gemini LangGraph Swarm
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - DOCKER_ENV=1
    volumes:
      - ./backend:/app
      - ./dataset:/app/dataset  # Map the root dataset folder to the backend
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: finshield-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000/api
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    restart: unless-stopped
