version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: finshield-backend
    ports:
      - "8000:8000"
    environment:
      # AWS RDS Settings (To be injected via .env on EC2)
      - DATABASE_URL=${DATABASE_URL:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ENVIRONMENT=production
    restart: always
